<div class="space-y-3">
  <div class="flex items-center justify-between">
    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">
      Featured Image
    </label>
    @if (value) {
      <span class="text-[11px] text-sky-400 font-medium">Image Ready</span>
    }
  </div>

  <!-- File Upload Button & Direct URL Input Group -->
  <div class="flex flex-col sm:flex-row gap-3">
    <!-- Hidden native file input -->
    <input
      type="file"
      #fileInput
      (change)="onFileSelected($event)"
      accept="image/*"
      class="hidden"
    />

    <!-- Choose File Button -->
    <button
      type="button"
      (click)="fileInput.click()"
      [disabled]="isDisabled || isUploading()"
      class="inline-flex items-center justify-center px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium transition border border-slate-700 disabled:opacity-50 shrink-0 cursor-pointer"
    >
      @if (isUploading()) {
        <svg class="w-4 h-4 mr-2 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          ></path>
        </svg>
        Uploading...
      } @else {
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
          />
        </svg>
        Choose File
      }
    </button>

    <!-- Fallback / Manual URL input text field -->
    <input
      type="url"
      [value]="value"
      (input)="onUrlInput($event)"
      [disabled]="isDisabled"
      placeholder="Or paste image URL here..."
      class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition disabled:opacity-50 font-mono"
    />
  </div>

  <!-- Live Image Preview Box -->
  @if (value) {
    <div
      class="relative rounded-xl overflow-hidden border border-slate-800 bg-slate-950 p-2 flex items-center gap-4"
    >
      <div
        class="w-20 h-14 rounded-lg bg-slate-900 border border-slate-800 overflow-hidden shrink-0"
      >
        <img
          [src]="value"
          alt="Featured image preview"
          class="w-full h-full object-cover"
          #previewImg
          (error)="previewImg.src = 'https://placehold.co/100x70/1e293b/ef4444?text=Broken+URL'"
        />
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-xs font-medium text-slate-300 truncate">Thumbnail Preview</p>
        <p class="text-[11px] text-slate-500 truncate mt-0.5 font-mono">
          {{ value }}
        </p>
      </div>
    </div>
  }
</div>
