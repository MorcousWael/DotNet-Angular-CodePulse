<nav class="bg-slate-900 border-b border-slate-800 text-slate-100 shadow-md">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Left Section: Logo & Main Navigation -->
      <div class="flex items-center space-x-8">
        <!-- Logo / Home Link -->
        <a
          routerLink="/"
          class="flex items-center space-x-2 text-xl font-bold tracking-tight text-white hover:text-sky-400 transition-colors"
        >
          <span class="bg-sky-500 text-slate-950 p-1.5 rounded-lg font-black text-sm">CP</span>
          <span>Code<span class="text-sky-400">Pulse</span></span>
        </a>

        <!-- Desktop Nav Links -->
        <div class="hidden md:flex items-center space-x-4">
          <a
            routerLink="/"
            routerLinkActive="text-sky-400 bg-slate-800/80"
            [routerLinkActiveOptions]="{ exact: true }"
            class="px-3 py-2 rounded-md text-sm font-medium hover:text-sky-400 hover:bg-slate-800 transition"
          >
            Home
          </a>

          <!-- Admin Dropdown Menu -->
          <div class="relative">
            <button
              (click)="toggleAdminMenu()"
              type="button"
              class="flex items-center space-x-1.5 px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition focus:outline-none"
            >
              <span>Admin</span>
              <svg
                class="w-4 h-4 transition-transform duration-200"
                [ngClass]="{ 'rotate-180': isAdminOpen }"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </button>

            <!-- Dropdown Menu items -->
            <div
              *ngIf="isAdminOpen"
              class="absolute left-0 mt-2 w-48 bg-slate-800 rounded-lg shadow-lg border border-slate-700 py-1 z-50 animate-in fade-in slide-in-from-top-2 duration-150"
            >
              <a
                routerLink="/admin/categories"
                (click)="isAdminOpen = false"
                routerLinkActive="bg-slate-700/60 text-sky-400"
                class="block px-4 py-2.5 text-sm text-slate-200 hover:bg-slate-700 hover:text-white transition"
              >
                Categories
              </a>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Section: Optional Actions / Login Placeholder -->
      <div class="hidden md:flex items-center space-x-4">
        <a
          routerLink="/login"
          class="text-sm font-medium px-4 py-2 rounded-lg bg-sky-500 text-slate-950 hover:bg-sky-400 transition shadow"
        >
          Sign In
        </a>
      </div>

      <!-- Mobile Hamburger Button -->
      <div class="md:hidden flex items-center">
        <button
          (click)="toggleMobileMenu()"
          type="button"
          class="p-2 rounded-md text-slate-400 hover:text-white hover:bg-slate-800 focus:outline-none"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              *ngIf="!isMobileMenuOpen"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
            <path
              *ngIf="isMobileMenuOpen"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Navigation Drawer -->
  <div
    *ngIf="isMobileMenuOpen"
    class="md:hidden bg-slate-900 border-t border-slate-800 px-4 pt-2 pb-4 space-y-1"
  >
    <a
      routerLink="/"
      (click)="isMobileMenuOpen = false"
      class="block px-3 py-2 rounded-md text-base font-medium text-white hover:bg-slate-800"
    >
      Home
    </a>

    <!-- Mobile Admin Section -->
    <div class="pt-2 pb-1 border-t border-slate-800">
      <div class="px-3 py-1 text-xs font-semibold text-slate-400 uppercase tracking-wider">
        Admin
      </div>
      <a
        routerLink="/admin/categories"
        (click)="isMobileMenuOpen = false"
        class="block px-3 py-2 rounded-md text-base font-medium text-slate-300 hover:text-white hover:bg-slate-800"
      >
        Categories
      </a>
    </div>

    <div class="pt-4">
      <a
        routerLink="/login"
        (click)="isMobileMenuOpen = false"
        class="block w-full text-center px-4 py-2 rounded-lg bg-sky-500 text-slate-950 font-medium hover:bg-sky-400"
      >
        Sign In
      </a>
    </div>
  </div>
</nav>
