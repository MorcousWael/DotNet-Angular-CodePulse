<!-- Backdrop & Modal Overlay -->
<div
  *ngIf="isOpen"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-in fade-in duration-200"
>
  <!-- Modal Card -->
  <div
    class="relative w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden animate-in zoom-in-95 duration-200"
  >
    <!-- Modal Header -->
    <div
      class="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-800/40"
    >
      <h2 class="text-lg font-semibold text-white">Add New Category</h2>
      <button
        (click)="onClose()"
        type="button"
        class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- Reactive Form -->
    <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" class="p-6 space-y-5">
      <!-- Category Name Field -->
      <div>
        <label
          for="name"
          class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2"
        >
          Category Name <span class="text-rose-400">*</span>
        </label>

        <input
          id="name"
          type="text"
          formControlName="name"
          (input)="onNameChange()"
          placeholder="e.g. ASP.NET Core"
          class="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border text-white placeholder-slate-500 text-sm focus:outline-none transition"
          [ngClass]="{
            'border-rose-500/80 focus:border-rose-500 focus:ring-1 focus:ring-rose-500':
              nameControl?.invalid && nameControl?.touched,
            'border-slate-800 focus:border-sky-500 focus:ring-1 focus:ring-sky-500':
              !nameControl?.invalid || !nameControl?.touched,
          }"
        />

        <!-- Name Validation Errors -->
        <div *ngIf="nameControl?.invalid && nameControl?.touched" class="mt-1.5 space-y-1">
          <p
            *ngIf="nameControl?.errors?.['required']"
            class="text-xs text-rose-400 flex items-center gap-1"
          >
            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
            Category name is required.
          </p>
          <p
            *ngIf="nameControl?.errors?.['minlength']"
            class="text-xs text-rose-400 flex items-center gap-1"
          >
            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
            Name must be at least 3 characters long.
          </p>
          <p
            *ngIf="nameControl?.errors?.['maxlength']"
            class="text-xs text-rose-400 flex items-center gap-1"
          >
            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
            Name cannot exceed 50 characters.
          </p>
        </div>
      </div>

      <!-- URL Handle Field -->
      <div>
        <label
          for="urlHandle"
          class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2"
        >
          URL Handle <span class="text-rose-400">*</span>
        </label>

        <div class="relative flex items-center">
          <span class="absolute left-3.5 text-slate-500 text-sm font-mono">/</span>
          <input
            id="urlHandle"
            type="text"
            formControlName="urlHandle"
            placeholder="aspnet-core"
            class="w-full pl-8 pr-3.5 py-2.5 rounded-lg bg-slate-950 border text-white placeholder-slate-500 text-sm font-mono focus:outline-none transition"
            [ngClass]="{
              'border-rose-500/80 focus:border-rose-500 focus:ring-1 focus:ring-rose-500':
                urlHandleControl?.invalid && urlHandleControl?.touched,
              'border-slate-800 focus:border-sky-500 focus:ring-1 focus:ring-sky-500':
                !urlHandleControl?.invalid || !urlHandleControl?.touched,
            }"
          />
        </div>

        <!-- URL Handle Validation Errors -->
        <div
          *ngIf="urlHandleControl?.invalid && urlHandleControl?.touched"
          class="mt-1.5 space-y-1"
        >
          <p
            *ngIf="urlHandleControl?.errors?.['required']"
            class="text-xs text-rose-400 flex items-center gap-1"
          >
            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
            URL handle is required.
          </p>
          <p
            *ngIf="urlHandleControl?.errors?.['minlength']"
            class="text-xs text-rose-400 flex items-center gap-1"
          >
            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
            URL handle must be at least 3 characters.
          </p>
          <p
            *ngIf="urlHandleControl?.errors?.['pattern']"
            class="text-xs text-rose-400 flex items-center gap-1"
          >
            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
            Use lowercase letters, numbers, and single hyphens (e.g. "my-category").
          </p>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
        <button
          type="button"
          (click)="onClose()"
          class="px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="categoryForm.invalid"
          class="px-4 py-2 rounded-lg bg-sky-500 text-slate-950 text-sm font-semibold hover:bg-sky-400 transition shadow disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Create Category
        </button>
      </div>
    </form>
  </div>
</div>
